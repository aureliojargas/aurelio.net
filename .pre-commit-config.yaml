default_install_hook_types: [pre-commit, pre-push]

exclude: |
  (?x)
  ^(
  # Released (versioned) files
  bin/python/txt2tags-r900\.py |
  moneylog/moneylog4-txt\.html |
  moneylog/moneylog[1-4]\.html |
  moneylog/portable/moneylog5\.html |
  projects/moneylog/moneylog[234]\.html |
  projects/sedsed/sedsed-1\.0 |
  sed/programas/arkanoid/arkanoid-1\.0\.sed |
  sed/programas/arkanoid/arkanoid-1\.1\.sed |
  sed/sokoban/sokoban\.sed |
  sed/1liners-ptBR\.txt |
  shell/dialog/index-v[1-6]\.t2t |
  vim/tutor\.pt_BR |
  vim/vimrc-ivan\.txt |
  vim/vimrc-voyeg3r\.txt |

  # Generated files
  moneylog/browser/app/index\.html |
  moneylog/portable/demo/index\.html |
  projects/moneylog/online/index\.html |
  projects/sedarkanoid/arkanoid\.sed\.html |
  projects/sedsed/email-linker\.sed\.html |
  projects/sedsokoban/sokoban\.sed\.html |
  sed/programas/arkanoid/arkanoid\.sed\.html |
  sed/sokoban/sokoban\.sed\.html |

  # Other
  log/index\.html  # moneylog v3 spinoff
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-vcs-permalinks
        exclude: |
          (?x)
          ^(
          _posts/2011-06-24-vi-livro-sed-txt\.html |
          _posts/2011-12-17-jogo-emomemory-agora-e-gratuito-codigo-fonte-liberado\.html
          )$
      - id: check-xml
        exclude: |
          (?x)
          ^(
          feed\.xml  # has front matter
          )$
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: |
          (?x)
          ^(
          bin/bash/aass |  # code
          bin/python/quizz/quizz |  # code
          .*\.(java|phps?|py|sed|sh|sql)  # code
          )$
      - id: mixed-line-ending
        exclude: |
          (?x)
          ^(
          bin/php/recados\.phps |     # false positive: has ^M
          doc/dotfiles/screenrc\.txt  # false positive: has ^M
          )$
      - id: trailing-whitespace
        exclude: |
          (?x)
          ^(
          _posts/2012-02-08-destacar-espacos-inuteis-no-codigo\.html |  # code with intended spaces
          _posts/2014-11-08-funcionario-publico\.md |  # Markdown line break
          _posts/2015-04-03-resposta-rapida-dev\.md |  # Markdown line break
          bin/bash/cgrep |  # code
          bin/bash/showlink |  # code
          bin/python/quizz/quizz |  # code
          doc/direto/anuncio\.txt |  # email signature delimiter
          doc/dotfiles/vimrc\.txt |  # comments and code with intended spaces
          pogo/index\.md |  # Markdown line break
          trem-eurostar/guia-ilustrado-para-pesquisar-precos-de-passagens/index\.md |  # Markdown line break
          trem-eurostar/tabela-de-precos-tarifas/index\.md |  # Markdown line break
          .*\.mgp |  # I don't remember if the spaces are required in Magic Point files
          .*\.t2t |  # txt2tags markup considers spaces
          .*\.(java|phps?|py|sed|sh|sql)  # code
          )$

  - repo: local
    hooks:
      - id: htmlhint
        name: HTMLHint (Linter)
        entry: htmlhint --config .htmlhintrc --format unix
        language: node
        additional_dependencies: [htmlhint@latest]  # Requires: sudo apt install libatomic1
        types: [html]
        require_serial: true  # otherwise it uses batches, confusing output

        # Paths violating active rules. Fix them.
        exclude: |
          (?x)
          ^(
          # Those probably can be fixed
          _includes/disqus\.html |
          _scripts/replace-templates/.*\.html |
          carve/index\.html |
          coisinha/subwaytor/index\.html |
          curso/material/vim-ref\.html |
          curso/sucesu/sucesu-seder-apoio\.html |
          doc/rdl/areas-compartilhadas\.html |
          doc/rdl/poder-modo-texto\.html |
          sed/gsed4_random_thread\.html |
          )$

  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      - id: djlint
